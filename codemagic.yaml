workflows:
  browserstack-screenshot-ipa:
    name: BrowserStack Screenshot IPA (iPad iOS 13)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.kliang.timetracer
      vars:
        XCODE_WORKSPACE: ios/TimeTracer.xcworkspace
        XCODE_SCHEME: TimeTracer
      node: latest

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Expo prebuild
        script: npx expo prebuild --platform ios --clean

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
